<title>Physics' Card Game — Card Collection</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #100f19;
    --panel: #1c1a2a;
    --accent: #87cadc;
    --text: #f5f3ff;
    --muted: #aaa6c0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
  }

  header {
    text-align: center;
    padding: 36px 16px 24px;
    background: linear-gradient(145deg, #292044, #14111f);
  }

  header h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
  header p { color: var(--muted); margin: 0; }

  main { max-width: 1100px; margin: auto; padding: 24px 16px 60px; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
  }

  button {
    background: var(--accent);
    color: #171126;
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    font: inherit;
    font-weight: 750;
    cursor: pointer;
  }

  button.secondary { background: #302b43; color: var(--text); }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

  #status { color: var(--muted); text-align: center; min-height: 24px; }

  h2 { margin-top: 36px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 16px;
  }

  .card {
    min-width: 0;
    background: var(--panel);
    border: 1px solid #39334e;
    border-radius: 12px;
    padding: 10px;
    overflow: hidden;
  }

  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: contain;
    background: #100f19;
    border-radius: 7px;
  }

  .card h3 { font-size: 1rem; margin: 10px 0 2px; overflow-wrap: anywhere; }
  .card p { color: var(--muted); font-size: .88rem; margin: 0; }
  .count { color: #d4c4ff !important; margin-top: 6px !important; }

  .empty {
    color: var(--muted);
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    grid-column: 1 / -1;
  }

  footer { color: var(--muted); text-align: center; padding: 24px; font-size: .85rem; }


/* Cosmic laboratory theme */
:root {
  --bg: #080d1a;
  --panel: #111b2e;
  --accent: #72e0f5;
  --text: #eff8ff;
  --muted: #94a9c4;
}

body {
  background:
    radial-gradient(ellipse at 50% 0%, #172c4b 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
}

header {
  position: relative;
  overflow: hidden;
  padding: 55px 16px 42px;
  background:
    radial-gradient(ellipse at 50% 100%, #254d75 0%, transparent 65%),
    linear-gradient(145deg, #101a33, #080d1a);
  border-bottom: 1px solid #29435e;
}

header h1 {
  letter-spacing: 0.04em;
  text-shadow: 0 0 28px #72e0f566;
}

header p {
  font-size: 1.05rem;
  letter-spacing: 0.08em;
}

main {
  max-width: 1200px;
}

h2 {
  letter-spacing: 0.025em;
}

button {
  transition: transform 180ms ease, box-shadow 180ms ease;
  box-shadow: 0 4px 20px #72e0f51c;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px #72e0f544;
}

button.secondary {
  border: 1px solid #3b4967;
}

.grid {
  grid-template-columns: repeat(
    auto-fill, minmax(175px, 1fr)
  );
  gap: 20px;
}

.card {
  position: relative;
  padding: 10px;
  background: linear-gradient(155deg, #182740, #0e1728);
  border: 1px solid #30425d;
  border-radius: 14px;
  transition:
    transform 220ms ease,
    border-color 220ms ease,
    box-shadow 220ms ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #72e0f5;
  box-shadow: 0 12px 30px #0007, 0 0 18px #72e0f51a;
}

.card img {
  background: #080d1a;
  border-radius: 9px;
}

.card h3 {
  line-height: 1.35;
}

.card p {
  line-height: 1.5;
}

.card .description {
  margin-top: 8px;
  font-size: 0.84rem;
  color: #b9cbe0;
}

.card .rarity {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 9px;
  border-radius: 20px;
  background: #26354c;
  color: #b9cce5;
  font-size: 0.75rem;
  font-weight: 750;
}

.card.rarity-rare {
  border-color: #a78bfa;
  box-shadow: inset 0 0 18px #a78bfa0b;
}

.card.rarity-rare .rarity {
  background: #49316c;
  color: #e1ceff;
}

.card.rarity-legendary {
  border-color: #e9bd68;
  background: linear-gradient(145deg, #352a27, #171a2b 65%);
  box-shadow: inset 0 0 24px #f8cf6710;
}

.card.rarity-legendary .rarity {
  background: #665022;
  color: #ffe5a1;
}

.card.reveal {
  animation: cardReveal 450ms ease both;
}

@keyframes cardReveal {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.94);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  header {
    padding: 38px 14px 30px;
  }

  main {
    padding-inline: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}


/* Compact card album */
#collection.grid {
  grid-template-columns: repeat(
    auto-fill,
    minmax(90px, 98px)
  );
  justify-content: start;
  gap: 14px;
}

#collection .card {
  padding: 7px;
  border-radius: 10px;
  cursor: pointer;
}

#collection .card img {
  aspect-ratio: 2 / 3;
  border-radius: 6px;
}

#collection .card h3 {
  font-size: 0.84rem;
  margin-top: 7px;
}

#collection .card .rarity {
  font-size: 0.68rem;
  padding: 2px 7px;
}

#collection .card .description {
  display: none;
}

#collection .card .count {
  font-size: 0.78rem;
}

@media (max-width: 480px) {
  #collection.grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
  }
}


/* Card inspection overlay */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(3, 6, 16, 0.84);
  backdrop-filter: blur(9px);
}

.modal-overlay[hidden] {
  display: none;
}

.modal {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 24px;
  width: min(680px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  background: linear-gradient(145deg, #192943, #0c1424);
  border: 1px solid #425b7b;
  border-radius: 18px;
  box-shadow: 0 25px 90px #000a;
  animation: modalIn 200ms ease-out;
}

.modal-art {
  display: flex;
  align-items: center;
}

.modal-art img {
  display: block;
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 10px;
}

.modal-info {
  align-self: center;
  min-width: 0;
}

.modal-info h2 {
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.modal-info .modal-description {
  color: #bdcce0;
  white-space: pre-line;
}

.modal-info .modal-count {
  margin-top: 20px;
  color: #9ee8fa;
  font-weight: 700;
}

.modal-close {
  position: absolute;
  z-index: 1;
  top: 10px;
  right: 10px;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid #52647d;
  border-radius: 50%;
  background: #18243a;
  color: white;
  font-size: 1.4rem;
  box-shadow: none;
}

.modal-close:hover {
  background: #344766;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 520px) {
  .modal {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 18px;
    padding-top: 52px;
  }

  .modal-art img {
    max-height: 42vh;
  }

  .modal-info h2 {
    margin-top: 4px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .modal {
    animation: none;
  }
}

const STORAGE_KEY = "my-gacha-collection-v1";
const $ = id => document.getElementById(id);

function loadCollection() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (!saved || typeof saved !== "object" || Array.isArray(saved)) return {};
    const clean = {};
    for (const card of cards) {
      const n = saved[card.id];
      if (Number.isSafeInteger(n) && n > 0) clean[card.id] = n;
    }
    return clean;
  } catch {
    return {};
  }
}

let collection = loadCollection();

function saveCollection() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collection));
    return true;
  } catch {
    $("status").textContent =
      "Your browser couldn't save the collection. Storage may be disabled or full.";
    return false;
  }
}

// Weighted random selection. Each draw is independent,
// so duplicate cards can appear in the same pack.
function pickCard() {
  const eligible = cards.filter(c =>
    Number.isFinite(c.weight) && c.weight > 0
  );

  const total = eligible.reduce((sum, c) => sum + c.weight, 0);
  if (!total) throw new Error("No cards have a positive weight.");

  let roll = Math.random() * total;

  for (const card of eligible) {
    roll -= card.weight;
    if (roll < 0) return card;
  }
  return eligible[eligible.length - 1];
}

function makeCardElement(card, count = null) {
  const article = document.createElement("article");

  const rarityClass = String(card.rarity)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-");

  article.className = `card rarity-${rarityClass}`;

  const img = document.createElement("img");
  img.src = card.image;
  img.alt = card.name;
  img.loading = "lazy";
  img.onerror = () => {
    img.alt = "Image not found: " + card.image;
  };

  const name = document.createElement("h3");
  name.textContent = card.name;

  const rarity = document.createElement("p");
  rarity.className = "rarity";
  rarity.textContent = card.rarity;

  article.append(img, name, rarity);

  if (card.description) {
    const description = document.createElement("p");
    description.className = "description";
    description.textContent = card.description;
    article.append(description);
  }

  if (count !== null) {
    const copies = document.createElement("p");
    copies.className = "count";
    copies.textContent = "Owned: " + count;
    article.append(copies);
  }


if (count !== null) {
  article.tabIndex = 0;
  article.setAttribute("role", "button");
  article.setAttribute(
    "aria-label",
    `Inspect ${card.name}, ${card.rarity}, owned: ${count}`
  );

  article.addEventListener("click", () => {
    openCardInspection(card);
  });

  article.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openCardInspection(card);
    }
  });
}

  return article;
}

const modal = $("card-modal");
let lastFocusedCard = null;

function openCardInspection(card) {
  lastFocusedCard = document.activeElement;

  $("modal-image").src = card.image;
  $("modal-image").alt = card.name;
  $("modal-title").textContent = card.name;
  $("modal-rarity").textContent = card.rarity;
  $("modal-description").textContent =
    card.description || "No description available yet.";
  $("modal-count").textContent =
    `Owned: ${collection[card.id] || 0}`;

  modal.hidden = false;
  $("modal-close").focus();
}

function closeCardInspection() {
  modal.hidden = true;

  if (lastFocusedCard?.isConnected) {
    lastFocusedCard.focus();
  }
}

$("modal-close").addEventListener(
  "click",
  closeCardInspection
);

modal.addEventListener("click", event => {
  if (event.target === modal) {
    closeCardInspection();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !modal.hidden) {
    closeCardInspection();
  }
});


function renderCollection() {
  const area = $("collection");
  area.replaceChildren();

  const owned = cards.filter(c => (collection[c.id] || 0) > 0);
  const totalCopies = Object.values(collection).reduce((a, b) => a + b, 0);

  $("summary").textContent =
    `${owned.length} / ${cards.length} unique cards discovered · ${totalCopies} total cards`;

  if (!owned.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Your collection is empty. Draw some cards to begin!";
    area.append(empty);
    return;
  }

  owned.forEach(card =>
    area.append(makeCardElement(card, collection[card.id]))
  );
}

function drawCards() {
  const results = $("results");
  results.replaceChildren();
  $("status").textContent = "";

  try {
    const drawn = Array.from({ length: 3 }, () => pickCard());

    for (const card of drawn) {
      collection[card.id] = (collection[card.id] || 0) + 1;
      const element = makeCardElement(card);
      element.classList.add("reveal");
      element.style.animationDelay = `${results.children.length * 150}ms`;
      results.append(element);
    }

    saveCollection();
    renderCollection();
    $("status").textContent = "You drew three cards!";
  } catch (error) {
    $("status").textContent = error.message;
  }
}

$("draw").addEventListener("click", drawCards);

$("reset").addEventListener("click", () => {
  if (!confirm("Delete your saved collection from this browser?")) return;
  collection = {};
  saveCollection();
  $("results").replaceChildren();
  renderCollection();
  $("status").textContent = "Your collection has been reset.";
});

renderCollection();
</script>
</body>
</html>
