
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics' Card Game — Card Collection</title>

<link rel="stylesheet" href="style.css">

</head>
<body>
<header>
  <h1> Physics' Card Game </h1>
  <p>In construction</p>
</header>

<main>
  <section aria-labelledby="summon-title">
    <h2 id="summon-title" style="text-align:center">Open a booster</h2>
    <p style="text-align:center;color:var(--muted)">
      Each booster contains three cards.
    </p>
    <div class="controls">
      <button id="draw">Open booster</button>
      <button id="reset" class="secondary">Reset collection</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>

    <h3 id="choices-title" hidden>Choose your next card</h3>
    <div id="results" class="grid"></div>

    <h3 id="chosen-title" hidden>Your new cards</h3>
    <div id="chosen-cards" class="grid"></div>
  </section>

  <section aria-labelledby="collection-title">
    <h2 id="collection-title">My collection</h2>
    <p id="summary" style="color:var(--muted)"></p>
    <div id="collection" class="grid"></div>
  </section>
</main>


<div
  id="card-modal"
  class="modal-overlay"
  hidden
  role="presentation"
>
  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-description"
  >
    <button
      type="button"
      class="modal-close"
      id="modal-close"
      aria-label="Close card inspection"
    >×</button>

    <div class="modal-art">
      <img id="modal-image" src="" alt="">
    </div>

    <div class="modal-info">
      <p id="modal-rarity" class="rarity"></p>
      <h2 id="modal-title"></h2>
      <p id="modal-description" class="modal-description"></p>
      <p id="modal-count" class="modal-count"></p>
    </div>
  </section>
</div>

<footer>Your collection is saved locally in this browser.</footer>

<script type="module" src="script.js"></script>

</body>
</html>
